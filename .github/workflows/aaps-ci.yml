```yaml
name: AAPS CI

on:
  workflow_dispatch:
    inputs:
      tagName:
        description: 'Select AAPS Version'
        required: true
        default: '3.4.2.6'
        type: choice
        options:
          # ── 3.4.x (JDK 21) ──────────────────────────────
          - 3.4.2.6
          - 3.4.2.4
          - 3.4.2.3
          - 3.4.2.2
          - 3.4.2.1
          - 3.4.2.0
          - 3.4.1.0
          - 3.4.0.0

          # ── 3.3.x (JDK 21) ──────────────────────────────
          - 3.3.2.1
          - 3.3.2.0
          - 3.3.1.3

          # ── 3.2.x (JDK 17) ──────────────────────────────
          - 3.2.0.4
          - 3.2.0.3
          - 3.2.0.2
          - 3.2.0.1
          - 3.2.0.0

          # ── 3.1.x (JDK 17) ──────────────────────────────
          - 3.1.0.3
          - 3.1.0.2
          - 3.1.0.1
          - 3.1.0

          # ── 3.0.x (JDK 11) ──────────────────────────────
          - 3.0.0.2
          - 3.0.0.1
          - 3.0.0

          # ── 2.x (build not supported) ────────────────────
          # 2.x versions depend on packages that were
          # previously available through JCenter.

      buildVariant:
        description: 'Select Build Variant'
        required: true
        default: 'fullRelease'
        type: choice
        options:
          - fullRelease
          - fullDebug
          - aapsclientRelease
          - aapsclientDebug
          - aapsclient2Release
          - aapsclient2Debug
          - pumpcontrolRelease
          - pumpcontrolDebug

jobs:

  # ============================================================
  # BUILD AAPS
  # ============================================================

  build:
    name: Build AAPS
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Decode signing secrets
      # --------------------------------------------------------

      - name: Decode Keystore Set
        run: |
          if [ -n "${{ secrets.KEYSTORE_SET }}" ]; then
            echo "🔐 Decoding KEYSTORE_SET..."

            DECODED=$(echo "${{ secrets.KEYSTORE_SET }}" | base64 -d)

            KEYSTORE_BASE64=$(echo "$DECODED" | cut -d'|' -f1)
            KEYSTORE_PASSWORD=$(echo "$DECODED" | cut -d'|' -f2)
            KEY_ALIAS=$(echo "$DECODED" | cut -d'|' -f3)
            KEY_PASSWORD=$(echo "$DECODED" | cut -d'|' -f4)

            echo "KEYSTORE_BASE64=$KEYSTORE_BASE64" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

            echo "::add-mask::$KEYSTORE_BASE64"
            echo "::add-mask::$KEYSTORE_PASSWORD"
            echo "::add-mask::$KEY_ALIAS"
            echo "::add-mask::$KEY_PASSWORD"

            echo "✅ Keystore parameters extracted from KEYSTORE_SET"

          else
            echo "ℹ️ KEYSTORE_SET not provided."
            echo "ℹ️ Using separate keystore secrets."

            echo "KEYSTORE_BASE64=${{ secrets.KEYSTORE_BASE64 }}" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi

      # --------------------------------------------------------
      # Check signing secrets
      # --------------------------------------------------------

      - name: Check Signing Secrets
        run: |
          echo "🔍 Checking required signing secrets..."

          MISSING=0

          check_secret() {
            if [ -z "$1" ]; then
              echo "❌ Missing secret: $2"
              MISSING=1
            fi
          }

          check_secret "$KEYSTORE_BASE64" "KEYSTORE_BASE64"
          check_secret "$KEYSTORE_PASSWORD" "KEYSTORE_PASSWORD"
          check_secret "$KEY_ALIAS" "KEY_ALIAS"
          check_secret "$KEY_PASSWORD" "KEY_PASSWORD"

          if [ "$MISSING" -eq 1 ]; then
            echo "🛑 Missing required signing secrets."
            exit 1
          fi

          echo "✅ All signing secrets are present."

      # --------------------------------------------------------
      # Decode keystore
      # --------------------------------------------------------

      - name: Decode Keystore File
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"

          echo "$KEYSTORE_BASE64" | base64 -d \
            > "$RUNNER_TEMP/keystore/keystore.jks"

          echo "✅ Keystore decoded."

      # --------------------------------------------------------
      # Validate keystore
      # --------------------------------------------------------

      - name: Validate Keystore
        run: |
          echo "🔐 Validating keystore, alias and passwords..."

          echo "test" > dummy.txt
          zip -q dummy.jar dummy.txt
          rm dummy.txt

          JARSIGNER_LOG=$(mktemp)

          if ! jarsigner \
              -keystore "$RUNNER_TEMP/keystore/keystore.jks" \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              dummy.jar \
              "$KEY_ALIAS" \
              > "$JARSIGNER_LOG" 2>&1; then

            echo "❌ Keystore validation failed."
            echo "❌ Check the following secrets:"
            echo "   KEYSTORE_BASE64"
            echo "   KEYSTORE_PASSWORD"
            echo "   KEY_ALIAS"
            echo "   KEY_PASSWORD"

            echo ""
            echo "🔍 jarsigner output:"
            cat "$JARSIGNER_LOG"

            rm -f "$JARSIGNER_LOG" dummy.jar
            exit 1
          fi

          rm -f "$JARSIGNER_LOG" dummy.jar

          echo "✅ Keystore, alias and passwords are valid."

      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------

      - name: Checkout Source Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # --------------------------------------------------------
      # Fetch selected AAPS tag
      # --------------------------------------------------------

      - name: Fetch Selected AAPS Tag
        run: |
          git remote add upstream https://github.com/nightscout/AndroidAPS.git || true

          git fetch upstream \
            refs/tags/${{ github.event.inputs.tagName }}:refs/tags/${{ github.event.inputs.tagName }}

          echo "✅ Tag ${{ github.event.inputs.tagName }} fetched."

      # --------------------------------------------------------
      # Determine Java version
      # --------------------------------------------------------

      - name: Determine JVM Version
        run: |
          TAG="${{ github.event.inputs.tagName }}"

          JAVA_VERSION=$(jq -r '.default' .github/jdk-map.json)

          while IFS=$'\t' read -r pattern jdk; do
            if [[ "$TAG" == "$pattern" ]]; then
              JAVA_VERSION="$jdk"
              break
            fi
          done < <(
            jq -r '.mappings[] | "\(.pattern)\t\(.jdk)"' .github/jdk-map.json
          )

          echo "JAVA_VERSION=$JAVA_VERSION" >> "$GITHUB_ENV"

          echo "ℹ️ AAPS tag: $TAG"
          echo "ℹ️ Java version: $JAVA_VERSION"

      # --------------------------------------------------------
      # Switch to selected tag
      # --------------------------------------------------------

      - name: Switch To Selected Tag
        run: |
          git checkout "refs/tags/${{ github.event.inputs.tagName }}"

          echo "✅ Checked out AAPS tag:"
          git describe --tags --exact-match HEAD

      # --------------------------------------------------------
      # Set build variant
      # --------------------------------------------------------

      - name: Set Build Variant
        run: |
          BUILD_VARIANT="${{ github.event.inputs.buildVariant }}"

          echo "BUILD_VARIANT=$BUILD_VARIANT" >> "$GITHUB_ENV"

          VARIANT_FLAVOR=$(
            echo "$BUILD_VARIANT" |
            sed -E 's/(Release|Debug)$//' |
            tr '[:upper:]' '[:lower:]'
          )

          VARIANT_TYPE=$(
            echo "$BUILD_VARIANT" |
            grep -oE '(Release|Debug)$' |
            tr '[:upper:]' '[:lower:]'
          )

          echo "VARIANT_FLAVOR=$VARIANT_FLAVOR" >> "$GITHUB_ENV"
          echo "VARIANT_TYPE=$VARIANT_TYPE" >> "$GITHUB_ENV"

          VERSION_SUFFIX=""

          if [[ "$VARIANT_FLAVOR" != "full" ]]; then
            VERSION_SUFFIX="$VARIANT_FLAVOR"
          fi

          if [[ "$VARIANT_TYPE" == "debug" ]]; then
            VERSION_SUFFIX="$VERSION_SUFFIX-debug"
          fi

          if [[ -n "$VERSION_SUFFIX" && "$VERSION_SUFFIX" != -* ]]; then
            VERSION_SUFFIX="-$VERSION_SUFFIX"
          fi

          echo "VERSION_SUFFIX=$VERSION_SUFFIX" >> "$GITHUB_ENV"

          echo "ℹ️ Build variant: $BUILD_VARIANT"
          echo "ℹ️ Flavor: $VARIANT_FLAVOR"
          echo "ℹ️ Build type: $VARIANT_TYPE"
          echo "ℹ️ Version suffix: $VERSION_SUFFIX"

      # --------------------------------------------------------
      # Extract AAPS version
      # --------------------------------------------------------

      - name: Extract Version
        run: |
          BRANCH_NAME=$(git rev-parse --abbrev-ref HEAD)

          if echo "$BRANCH_NAME" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            VERSION="$BRANCH_NAME"
          else
            VERSION=$(
              grep 'val appVersion' \
                buildSrc/src/main/kotlin/Versions.kt |
              awk -F '"' '{print $2}'
            )
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          echo "ℹ️ AAPS version: $VERSION"

      # --------------------------------------------------------
      # Set up Java
      # --------------------------------------------------------

      - name: Set Up JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      # --------------------------------------------------------
      # Make Gradle executable
      # --------------------------------------------------------

      - name: Grant Execute Permission To Gradlew
        run: |
          chmod +x gradlew

      # --------------------------------------------------------
      # Build AAPS APK and Wear APK
      # --------------------------------------------------------

      - name: Build APKs
        run: |
          echo "🚀 Starting AAPS build..."
          echo "📦 Variant: $BUILD_VARIANT"
          echo "☕ Java: $JAVA_VERSION"
          echo "📌 Version: $VERSION"

          ./gradlew \
            ":app:assemble${BUILD_VARIANT}" \
            ":wear:assemble${BUILD_VARIANT}" \
            -Dorg.gradle.jvmargs="-Xmx8g -XX:+UseParallelGC -Xss1024m" \
            -Dkotlin.daemon.jvm.options="-Xmx2g" \
            -Dkotlin.compiler.execution.strategy="in-process" \
            -Dorg.gradle.daemon=true \
            -Dorg.gradle.workers.max=8 \
            -Dorg.gradle.caching=true \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/keystore/keystore.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

          echo "✅ AAPS build completed."

      # --------------------------------------------------------
      # Rename APKs
      # --------------------------------------------------------

      - name: Rename APKs
        run: |
          echo "📦 Preparing APK files..."

          APP_APK=$(find \
            "app/build/outputs/apk/$VARIANT_FLAVOR/$VARIANT_TYPE" \
            -maxdepth 1 \
            -type f \
            -name "*.apk" |
            head -n 1)

          WEAR_APK=$(find \
            "wear/build/outputs/apk/$VARIANT_FLAVOR/$VARIANT_TYPE" \
            -maxdepth 1 \
            -type f \
            -name "*.apk" |
            head -n 1)

          if [ -z "$APP_APK" ]; then
            echo "❌ AAPS APK not found."
            find app/build/outputs/apk -type f -name "*.apk" || true
            exit 1
          fi

          if [ -z "$WEAR_APK" ]; then
            echo "❌ Wear APK not found."
            find wear/build/outputs/apk -type f -name "*.apk" || true
            exit 1
          fi

          cp "$APP_APK" \
            "aaps-${VERSION}${VERSION_SUFFIX}.apk"

          cp "$WEAR_APK" \
            "aaps-wear-${VERSION}${VERSION_SUFFIX}.apk"

          echo "✅ APKs prepared:"
          ls -lh *.apk

      # --------------------------------------------------------
      # Upload APKs to GitHub Actions
      # --------------------------------------------------------

      - name: Upload APKs To GitHub
        uses: actions/upload-artifact@v4
        with:
          name: AAPS-${{ env.VERSION }}${{ env.VERSION_SUFFIX }}
          path: |
            aaps-${{ env.VERSION }}${{ env.VERSION_SUFFIX }}.apk
            aaps-wear-${{ env.VERSION }}${{ env.VERSION_SUFFIX }}.apk
          if-no-files-found: error
          retention-days: 30

      # --------------------------------------------------------
      # Show build information
      # --------------------------------------------------------

      - name: Build Summary
        run: |
          echo ""
          echo "=========================================="
          echo "🎉 AAPS BUILD SUCCESSFUL"
          echo "=========================================="
          echo ""
          echo "Version:       $VERSION"
          echo "Variant:       $BUILD_VARIANT"
          echo "Java:          $JAVA_VERSION"
          echo ""
          echo "APKs:"
          ls -lh *.apk
          echo ""
          echo "The APKs are available in the"
          echo "GitHub Actions Artifacts section."
          echo "=========================================="

  # ============================================================
  # CLEANUP OLD WORKFLOW RUNS
  # ============================================================

  cleanup:
    name: Cleanup Old Workflow Runs
    needs: build
    if: always()
    permissions:
      actions: write
    uses: ./.github/workflows/cleanup-workflow-runs.yml
    with:
      workflow_name: 'AAPS CI'
      keep_runs: 20
      keep_threshold: 5
```
